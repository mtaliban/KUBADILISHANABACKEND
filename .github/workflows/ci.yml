name: Backend CI

# ============================================================
# CI — Backend tests pekee.
# CD (deploy) ni workflow nyingine ("Backend CD") inayoanza
# TU baada ya hii kufaulu (workflow_run: completed + success).
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI — Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run pytest
        run: pytest -v --tb=short
