name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ STEP 1: CI ============
  test:
    name: CI — Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run pytest
        run: pytest -v --tb=short

  docker-build:
    name: CI — Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validate Dockerfile — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kv-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ STEP 2: CD (inakuja TU baada ya CI kufaulu) ============
  # Deploy: git pull + docker compose up kwenye EC2 yako.
  # Inarun kwenye push ya main pekee (sio pull requests).
  deploy:
    name: CD — Deploy to EC2 (16.171.23.21)
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Deploy to EC2
        # Deploy ina-run tu kama secrets zote 3 zipo. Ukikosa hata moja,
        # step ina-skip kwa rafiki — sio fail nyekundu.
        if: ${{ env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" '
            set -e

            # Clone ikiwa haipo (marafiki ya kwanza tu)
            APP_DIR=~/kv-backend
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/mtaliban/KUBADILISHANABACKEND.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            # .env ikiwa haipo, nakili kutoka .env.example (badilisha JWT_SECRET baadaye)
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "::warning::EC2: .env haikuwepo — imenakiliwa kutoka .env.example. Badilisha JWT_SECRET na MQTT_PASSWORD!"
            fi

            docker compose up -d --build --pull always
            sleep 5
            echo "=== Health check ==="
            curl -s -o /dev/null -w "health: %{http_code}\n" http://localhost:8000/health || echo "health: unreachable"
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
          '

      - name: Skip notice (EC2 secrets bado hazijawekwa)
        if: ${{ env.EC2_HOST == '' || env.EC2_USER == '' || env.EC2_SSH_KEY == '' }}
        run: |
          echo "::warning::EC2 secrets hazijawekwa bado — deploy imeskipped (hii ni sawa)."
          echo "Weka EC2_HOST, EC2_USER, EC2_SSH_KEY kwenye:"
          echo "https://github.com/mtaliban/KUBADILISHANABACKEND/settings/secrets/actions"
