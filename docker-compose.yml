# Backend-only compose: 1 monolith + Mongo + MQTT broker (Mosquitto) + Redis.
# Kila kitu kinakaa kwenye backend yako mwenyewe (EC2/local) — hakuna cloud
# broker wala cloud database. Inataka cloud? Badilisha MQTT_HOST/MONGO_URI tu.
services:
  mongodb:
    image: mongo:4.4
    container_name: kv_mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: kubadilishana_vituo
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks: [kv_net]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: kv_mosquitto
    restart: unless-stopped
    ports: ["1883:1883", "9001:9001"]
    # mosquitto.passwd haiko kwenye git (security!) — ina-generate hapa kwenye
    # startup kutoka MQTT_USERNAME/MQTT_PASSWORD env vars.
    command: >
      # passwd file lazima iwe readable na user 'mosquitto' (mosquitto ina-drop
      # privileges) — ndiyo maana tunafanya chmod 644 baada ya kui-generate.
      sh -c "rm -f /mosquitto/config/mosquitto.passwd
      && mosquitto_passwd -b -c /mosquitto/config/mosquitto.passwd
      ${MQTT_USERNAME:-kvuser} ${MQTT_PASSWORD:-KvChangeMe2026}
      && chmod 644 /mosquitto/config/mosquitto.passwd
      && exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-kvuser}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-KvChangeMe2026}
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks: [kv_net]

  redis:
    image: redis:7-alpine
    container_name: kv_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [kv_net]

  backend:
    build: .
    image: mtalibani/kubadilishan:latest
    container_name: kv_backend
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/kubadilishana_vituo?authSource=admin
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-kvuser}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-KvChangeMe2026}
      MQTT_USE_TLS: ${MQTT_USE_TLS:-false}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALG: HS256
      JWT_EXPIRE_HOURS: 168
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./csv_output:/app/csv_output
    depends_on: [mongodb, mosquitto, redis]
    networks: [kv_net]

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
  redis_data:

networks:
  kv_net:
    driver: bridge
